<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sangji-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008a40" />
      <stop offset="100%" stop-color="#00632d" />
    </linearGradient>
    <linearGradient id="sangji-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#sangji-bg-grad)" />
  <!-- Inner Highlight Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" ry="100" fill="none" stroke="url(#sangji-border-grad)" stroke-width="8" />

  <!-- School Emblem Year Tag at top -->
  <text x="256" y="82" fill="rgba(255,255,255,0.65)" font-size="28" font-weight="700" font-family="'Pretendard', 'Noto Sans KR', 'Arial', sans-serif" text-anchor="middle" letter-spacing="4">SINCE 1964</text>

  <!-- Korean Text: 상지 / 여중 (2x2 Grid) -->
  <g fill="#ffffff" font-family="'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-weight="900" font-size="160" text-anchor="middle">
    <!-- Row 1: 상 지 -->
    <text x="170" y="235">상</text>
    <text x="342" y="235">지</text>
    <!-- Row 2: 여 중 -->
    <text x="170" y="415">여</text>
    <text x="342" y="415">중</text>
  </g>

  <!-- Center subtle decorative accent -->
  <circle cx="256" cy="275" r="5" fill="#fcd34d" opacity="0.8" />
</svg>
